name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          pip install -r requirements.txt

      - name: Build PDF and web version
        run: python3 build.py

      - name: Sanity check
        run: |
          pages=$(pdfinfo dovidnyk_vyzhyvannia.pdf | awk '/^Pages:/ {print $2}')
          echo "Pages: $pages"
          test "$pages" -ge 100 || { echo "::error::PDF has only $pages pages — build looks broken"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dovidnyk_vyzhyvannia
          path: dovidnyk_vyzhyvannia.pdf

      # Keep the in-repo PDF and GitHub Pages (docs/) in sync with chapters/ —
      # the author cannot run weasyprint locally, so CI commits the build back.
      - name: Commit built files back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dovidnyk_vyzhyvannia.pdf docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "build: оновити PDF і веб-версію [skip ci]"
            git push
          fi

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dovidnyk_vyzhyvannia.pdf
          generate_release_notes: true
